name: Publish Docker image

# Called only after every CI job has passed for the same commit.
on:
  workflow_call:

permissions: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish amd64 and arm64 image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # Publish the tested image to GitHub Container Registry.
    steps:
      - name: Check out tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set image metadata
        id: metadata
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ghcr.io/guangdai/freshrss-reader
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=FreshRSS Reader
            org.opencontainers.image.description=Self-hosted FreshRSS with the enhanced Reader interface
            org.opencontainers.image.source=https://github.com/GuangDai/FreshRSS-Reader
            org.opencontainers.image.url=https://github.com/GuangDai/FreshRSS-Reader
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tested image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=reader-amd64
            type=gha,scope=reader-multiarch
          cache-to: type=gha,mode=max,scope=reader-multiarch
          provenance: mode=max
          sbom: true

      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo 'Published image digest:'
            echo "\`$IMAGE_DIGEST\`"
            echo
            echo 'Image tags:'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
