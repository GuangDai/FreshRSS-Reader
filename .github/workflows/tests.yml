name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP and refresh workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, gmp, intl, mbstring, opcache, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite, simplexml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install libcurl for decoded response size tests
        # The native decoded-byte limit tested below requires libcurl 8.20 or newer.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev libpsl-dev zlib1g-dev
          curl_build="$RUNNER_TEMP/freshrss-curl-build"
          curl_prefix="$RUNNER_TEMP/freshrss-curl"
          mkdir -p "$curl_build"
          curl --fail --location --retry 3 --output "$curl_build/curl.tar.xz" https://github.com/curl/curl/releases/download/curl-8_22_0/curl-8.22.0.tar.xz
          echo "f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7  $curl_build/curl.tar.xz" | sha256sum --check
          tar -xf "$curl_build/curl.tar.xz" -C "$curl_build"
          cd "$curl_build/curl-8.22.0"
          ./configure --prefix="$curl_prefix" --enable-shared --disable-static --enable-versioned-symbols --with-openssl --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt
          make -C lib -j"$(nproc)"
          make -C lib install
          echo "LD_LIBRARY_PATH=$curl_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify PHP uses the required libcurl
        run: |
          php --ri curl
          php -r '$version = curl_version()["version"]; if ($version !== "8.22.0") { fwrite(STDERR, "Expected libcurl 8.22.0, got $version\n"); exit(1); }'

      - name: Install locked PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP and template syntax
        run: |
          composer run-script php-lint
          composer run-script phtml-lint

      - name: Check translations
        run: composer run-script translations && git diff --exit-code

      - name: Run PHP unit tests
        run: composer run-script phpunit -- --no-progress

      - name: Check PHP coding standards and types
        run: |
          composer run-script phpcs
          composer run-script phpstan -- --no-progress

      - name: Test real refresh workers and scheduler recovery
        run: |
          python3 tests/integration/refresh/scheduler_test.py --php php
          python3 tests/integration/refresh/concurrency_test.py --php php
          python3 tests/integration/refresh/control_test.py --php php
          python3 tests/integration/refresh/legacy_test.py --php php

  frontend:
    name: Frontend and assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run --silent test:frontend

      - name: Check JavaScript, CSS and Markdown
        run: |
          npm run --silent eslint
          npm run --silent stylelint
          npm run --silent markdownlint

      - name: Check generated assets
        run: |
          npm run --silent rtlcss
          npm run --silent svgo
          git diff --exit-code

  browser:
    name: Reader browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up PHP for rendered browser fixtures
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, dom, gmp, intl, mbstring, pdo_sqlite, simplexml, xmlreader, zip
          coverage: none
          tools: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test appearance, reading and account settings
        run: |
          npm run test:browser:appearance -- --project=desktop
          npm run test:browser:reading -- --project=desktop
          npm run test:browser:account -- --project=desktop

  database:
    name: SQLite and PostgreSQL contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, gmp, intl, mbstring, opcache, pcntl, pdo_pgsql, pdo_sqlite, simplexml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql

      - name: Test real schemas, contracts and concurrent writes
        run: |
          postgres_bin=$(find /usr/lib/postgresql -mindepth 3 -maxdepth 3 -type f -name initdb -printf '%h\n' | sort -V | tail -n1)
          python3 tests/integration/database/matrix.py --php php --postgres-bin "$postgres_bin"

  scripts:
    name: Shell, Dockerfile and spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install shell and spelling tools
        run: |
          mkdir -p bin
          echo "${PWD}/bin" >> "$GITHUB_PATH"
          GOBIN="${PWD}/bin" go install mvdan.cc/sh/v3/cmd/shfmt@v3.8.0
          curl --fail --location --retry 3 --output bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          echo '6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  bin/hadolint' | sha256sum --check
          chmod +x bin/hadolint
          curl --fail --location --retry 3 --output bin/typos.tar.gz https://github.com/crate-ci/typos/releases/download/v1.49.0/typos-v1.49.0-x86_64-unknown-linux-musl.tar.gz
          echo '48bd2d58e02ce713b8c0f1aa239e68ee4f7d8c551013135806e6aed3938d9e10  bin/typos.tar.gz' | sha256sum --check
          tar -xzf bin/typos.tar.gz -C bin ./typos

      - name: Check shell scripts
        run: ./tests/shellchecks.sh

      - name: Check Dockerfiles
        run: find . -name 'Dockerfile*' -not -path './node_modules/*' -print0 | xargs -0 -n1 bin/hadolint --failure-threshold warning

      - name: Check spelling
        run: bin/typos

  security:
    name: Workflow security
    uses: ./.github/workflows/zizmor.yml
    permissions:
      contents: read

  image:
    name: Build and smoke-test image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build runnable image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: freshrss-reader:ci
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=reader-amd64
          cache-to: type=gha,mode=max,scope=reader-amd64

      - name: Test installation, HTTP service and refresh queue
        run: Docker/smoke-test.sh freshrss-reader:ci

  publish:
    name: Publish tested image
    needs: [php, frontend, browser, database, scripts, security, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write # Pass registry write permission to the image publisher.
