services:
  app:
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: freshrss
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: ${FRESHRSS_DB_PASSWORD:?Set FRESHRSS_DB_PASSWORD in .env before starting PostgreSQL}
    volumes:
      - app-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    shm_size: 128m
    pids_limit: 64
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=30"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshrss -d freshrss"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-postgres:
